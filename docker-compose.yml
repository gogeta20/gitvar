services:
  dev:
    build:
      context: .
      dockerfile: devops/docker/Dockerfile.dev
    container_name: gitmap-dev-parallel
    working_dir: /workspace
    environment:
      - GITMAP_BROWSE_ROOT=/host/home
    volumes:
      - ./:/workspace
      - ${HOME}:/host/home
      - cargo-cache:/usr/local/cargo/registry
      - rustup-cache:/usr/local/rustup
      - node-cache:/workspace/frontend/node_modules
    tty: true
    stdin_open: true
    ports:
      - "5174:5174"
      - "7879:7879"
    command: sleep infinity

volumes:
  cargo-cache:
  rustup-cache:
  node-cache:
