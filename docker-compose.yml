services:
  dev:
    build:
      context: .
      dockerfile: devops/docker/Dockerfile.dev
    container_name: gitmap-dev
    working_dir: /workspace
    volumes:
      - ./:/workspace
      - cargo-cache:/usr/local/cargo/registry
      - rustup-cache:/usr/local/rustup
      - node-cache:/workspace/frontend/node_modules
    tty: true
    stdin_open: true
    ports:
      - "5173:5173"
      - "7878:7878"
    command: sleep infinity

volumes:
  cargo-cache:
  rustup-cache:
  node-cache:

